services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waas-cms-engine
    ports:
      - "3100:3000"
    volumes:
      - waas-data:/app/server/data
    environment:
      - PORT=3000
      - DB_PATH=/app/server/data/waas.db
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  waas-data:
    driver: local
